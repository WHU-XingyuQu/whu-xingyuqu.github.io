<p>如果被调函数放在主函数后面，需要在主函数之前进行说明</p>
<h2>2. 内联函数</h2>
<h3>（1）使用内联函数的意义</h3>
<p>函数调用有一定的空间和时间开销，影响程序的运行效率。引用内联函数可以提高程序的运行效率，节省调用函数的时间开销，是一种用时间换空间的方案</p>
<h3>（2）运用内联函数的合适情况</h3>
<p>对于一些代码量不是很大，但又频繁调用的函数，则引入内联函数</p>
